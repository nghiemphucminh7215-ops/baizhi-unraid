# 依据百智办公 v26111301 官方发布包适配；镜像授权独立于本仓库许可证。
name: baizhi-work
x-app: &app
  platform: linux/amd64
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
x-db-env: &db-env
  POSTGRES_DB: monkeyai
  POSTGRES_USER: monkeyai
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置独立的随机十六进制数据库密码}
x-db-url: &db-url postgres://monkeyai:${POSTGRES_PASSWORD}@db:5432/monkeyai?sslmode=disable
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 5
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"
services:
  permissions:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/monkeycode/monkeyai-backend:v26111301
    platform: linux/amd64
    user: "0:0"
    restart: "no"
    read_only: true
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    entrypoint: ["/bin/sh"]
    command:
      - -ec
      - chmod 700 /runtime /license /import-tmp /rustfs /rustfs-logs && chown 10001:10001 /runtime /license /import-tmp /rustfs /rustfs-logs
    volumes:
      - runtime:/runtime
      - license:/license
      - import_tmp:/import-tmp
      - rustfs:/rustfs
      - rustfs_logs:/rustfs-logs
    logging: *logging
  db:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/basic/postgres:18.6
    platform: linux/amd64
    restart: unless-stopped
    environment: *db-env
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logging
  rustfs:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/basic/rustfs:v1.0.0-rc.5
    platform: linux/amd64
    user: "10001:10001"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?请设置对象存储访问标识}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?请设置独立的随机对象存储密钥}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    logging: *logging
  migrate:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/monkeycode/monkeyai-migrate:v26111301
    platform: linux/amd64
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["-path=/migrations", "-database", *db-url, "up"]
    logging: *logging
  backend:
    <<: *app
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/monkeycode/monkeyai-backend:v26111301
    user: "10001:10001"
    depends_on:
      permissions:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      MONKEYAI_DATABASE_URL: *db-url
      MONKEYAI_HTTP_ADDR: :8080
      MONKEYAI_PUBLIC_URL: ${MONKEYAI_PUBLIC_URL:?请设置客户端实际访问的服务器根地址}
      MONKEYAI_INITIAL_ADMIN_EMAIL: ${MONKEYAI_INITIAL_ADMIN_EMAIL:?请设置首次管理员邮箱}
      MONKEYAI_INITIAL_ADMIN_PASSWORD: ${MONKEYAI_INITIAL_ADMIN_PASSWORD-}
      MONKEYAI_LOG_LEVEL: warn
      MONKEYAI_RUNTIME_RELAY: "true"
      MONKEYAI_RUNTIME_STATE_DIR: /app/runtime
      MONKEYAI_S3_ENDPOINT: http://rustfs:9000
      MONKEYAI_S3_REGION: us-east-1
      MONKEYAI_S3_BUCKET: monkeyai-resources
      MONKEYAI_S3_FORCE_PATH_STYLE: "true"
      MONKEYAI_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      MONKEYAI_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      TMPDIR: /app/import-tmp
      NO_PROXY: localhost,127.0.0.1,::1,db,rustfs,backend
    volumes:
      - runtime:/app/runtime
      - license:/app/license
      - import_tmp:/app/import-tmp
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      start_period: 90s
    logging: *logging
  admin:
    <<: *app
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/monkeycode/monkeyai-admin:v26111301
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MONKEYAI_PUBLIC_URL: ${MONKEYAI_PUBLIC_URL:?请设置服务器对外地址}
      MONKEYAI_TLS_ENABLED: "false"
      MONKEYAI_AUTO_TLS_ENABLED: "false"
      MONKEYAI_TRUSTED_PROXY_CIDRS: ${MONKEYAI_TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${MONKEYAI_BIND_IP:-127.0.0.1}:${MONKEYAI_ADMIN_PORT:-8088}:8080"
    volumes:
      - acme:/var/lib/nginx/acme
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      start_period: 5s
    logging: *logging
volumes:
  postgres:
  rustfs:
  rustfs_logs:
  runtime:
  license:
  import_tmp:
  acme:
